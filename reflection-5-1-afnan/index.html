.hero{position:absolute;inset:4vh auto auto 4vw;width:min(560px,90vw);background:rgba(255,255,255,.88);border-radius:24px;padding:30px}
.hero img{height:56px}
.hero h1{font-size:44px;margin:12px 0 4px}
.hero p{margin:6px 0;line-height:1.7}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.teams input{font-family:inherit;font-size:18px;font-weight:700;padding:12px;border-radius:14px;border:2px solid var(--line);width:100%;text-align:center;color:var(--navy)}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
.top h2{margin:0;font-size:24px}.sp{flex:1}
.score{display:flex;gap:12px}
.team{min-width:170px;border-radius:16px;padding:8px 16px;color:#fff;text-align:center;transition:all .3s;opacity:.55}
.team.t0{background:var(--navy)}.team.t1{background:var(--rose)}
.team.turn{opacity:1;transform:scale(1.07);box-shadow:0 0 0 4px var(--gold)}
.team b{display:block;font-size:30px}
/* board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px;max-width:1100px;margin:auto}
.cat{background:var(--navy);color:#fff;border-radius:16px;padding:16px;text-align:center;font-size:20px;font-weight:700}
.cat:nth-child(2){background:var(--rose)}.cat:nth-child(3){background:var(--teal)}
.tile{background:#fff;border:3px solid var(--line);border-radius:16px;height:92px;font-size:34px;font-weight:700;color:var(--gold);cursor:pointer;font-family:inherit;transition:all .2s}
.tile:hover{border-color:var(--gold);transform:scale(1.03)}
.tile.done{background:#EEF0F4;color:#B0B4C0;cursor:default;transform:none;border-color:#EEF0F4}
/* modal */
.modal{position:fixed;inset:0;background:rgba(31,42,92,.55);display:none;align-items:center;justify-content:center;z-index:10}
.modal.on{display:flex}
.card{background:#fff;border-radius:24px;padding:28px;width:min(860px,94vw);position:relative;animation:pop .35s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.qhead{display:flex;align-items:center;gap:12px}
.pts{background:var(--gold);color:#fff;border-radius:999px;padding:6px 16px;font-weight:700}
.who{font-weight:700}
.ring{width:74px;height:74px;margin-inline-start:auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.qtext{font-size:28px;font-weight:700;line-height:1.6;margin:18px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font-family:inherit;font-size:21px;font-weight:700;padding:16px;border-radius:16px;border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;text-align:right}
.opt:hover{background:var(--blush)}
.opt.ok{background:var(--green);color:#fff;border-color:var(--green)}
.opt.bad{background:var(--red);color:#fff;border-color:var(--red)}
.opt:disabled{cursor:default}
.msg{margin-top:16px;font-size:20px;font-weight:700;min-height:30px}
.exp{background:var(--blush);border-radius:14px;padding:12px 16px;margin-top:10px;display:none;line-height:1.7}
/* wheel */
#wheel .wrap{display:grid;grid-template-columns:auto 1fr;gap:30px;padding:24px;max-width:1100px;margin:auto;align-items:center}
#wc{width:min(520px,80vw);height:auto}
textarea{font-family:inherit;font-size:16px;width:100%;height:220px;border-radius:14px;border:2px solid var(--line);padding:10px}
.picked{font-size:40px;font-weight:700;color:var(--rose);min-height:60px;text-align:center}
/* end */
#end .box{max-width:700px;margin:8vh auto;background:#fff;border-radius:24px;padding:40px;text-align:center}
#end h1{font-size:46px;margin:10px 0}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:20}
@media(max-width:800px){#wheel .wrap{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}
</style>
</head>

    <div><p><b>أسماء الطالبات (اسم في كل سطر):</b></p><textarea id="names"></textarea>
      <div class="row" style="margin:12px 0"><button class="btn rose" onclick="spin()">دوّري العجلة</button><button class="btn ghost" onclick="drawWheel()">تحديث الأسماء</button>
      <label style="align-self:center;font-weight:700"><input type="checkbox" id="rm"> حذف الاسم بعد اختياره</label></div>
      <div class="picked" id="picked"></div></div>
  </div>
</section>
<!-- END -->
<section class="screen" id="end"><div class="box"><div style="font-size:70px">🏆</div><h1 id="winner"></h1><p id="final" style="font-size:22px"></p><div class="row" style="justify-content:center"><button class="btn rose" onclick="location.reload()">جولة جديدة</button></div></div></section>
<!-- MODAL -->
<div class="modal" id="modal"><div class="card">
  <div class="qhead"><span class="pts" id="mp"></span><span class="who" id="mw"></span>
    <div class="ring"><svg viewBox="0 0 74 74" width="74" height="74"><circle cx="37" cy="37" r="32" fill="none" stroke="#FCE4EC" stroke-width="7"/><circle id="rc" cx="37" cy="37" r="32" fill="none" stroke="#C9A227" stroke-width="7" stroke-dasharray="201" stroke-dashoffset="0" stroke-linecap="round"/></svg><span id="rt">30</span></div></div>
  <div class="qtext" id="mq"></div>
  <div class="opts" id="mo"></div>
  <div class="msg" id="mm"></div>
  <div class="exp" id="me"></div>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="close" onclick="closeQ()" style="display:none">العودة للوحة ◀</button></div>
</div></div>
<script>
const CATS=[{n:'قانون الانعكاس',q:[
 ['زاوية سقوط شعاع على مرآة مستوية 30°. زاوية انعكاسه:',['30°','60°','90°','15°'],0,'θr = θi = 30°'],
 ['شعاع يصنع مع سطح المرآة زاوية 25°. زاوية الانعكاس:',['25°','50°','65°','115°'],2,'θi = 90° − 25° = 65° = θr'],
 ['زاوية السقوط 42°. الزاوية بين الشعاع الساقط والمنعكس:',['42°','48°','84°','90°'],2,'2θi = 84°'],
 ['دارت مرآة بزاوية 15°. يدور الشعاع المنعكس بزاوية:',['7.5°','15°','30°','45°'],2,'يدور الشعاع المنعكس 2α = 30°']]},
 {n:'منتظم وغير منتظم',q:[
 ['أيّ السطوح الآتية يعكس الضوء انعكاسًا منتظمًا؟',['الورقة','سطح ماء ساكن','الجدار','المعدن الخشن'],1,'الماء الساكن سطح أملس.'],
 ['في الانعكاس غير المنتظم تكون الأعمدة المقامة:',['متوازية','غير متوازية','منطبقة','معدومة'],1,'لأن السطح خشن فتختلف اتجاهات الأعمدة.'],
 ['نرى القمر من أي مكان على الأرض لأنه:',['مضيء','يعكس انعكاسًا منتظمًا','يعكس انعكاسًا غير منتظم','شفاف'],2,'سطحه خشن فيشتّت ضوء الشمس.'],
 ['سكب الماء على زجاج خشن يجعل انعكاسه:',['أكثر تشتّتًا','منتظمًا أكثر','يختفي','حقيقيًا'],1,'الماء يملأ النتوءات فيصبح السطح أملس.']]},
 {n:'صور المرايا المستوية',q:[
 ['وقفت طالبة على بُعد 2 m من مرآة. بُعد صورتها عن المرآة:',['1 m','2 m','4 m','0 m'],1,'di = −do ، أي 2 m خلف المرآة.'],
 ['طفل طوله 50 cm أمام مرآة مستوية. طول صورته:',['25 cm','50 cm','100 cm','يعتمد على البعد'],1,'hi = ho'],
 ['اقتربت طالبة 1 m من المرآة. تقلّ المسافة بينها وبين صورتها:',['0.5 m','1 m','2 m','4 m'],2,'تقترب هي 1 m وتقترب الصورة 1 m.'],
 ['رأيتِ ساعة في المرآة تشير إلى 10:00. الوقت الحقيقي:',['10:00','2:00','4:00','8:00'],1,'الحقيقي = 12:00 − 10:00 = 2:00']]}];
const PTS=[100,200,300,400];
let names=['',''],score=[0,0],turn=0,cur=null,timer=null,left=30,stealing=false,prev='start';
const $=id=>document.getElementById(id);
let AC;function tone(f,d,t='sine',v=.18,delay=0){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+delay;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
const SND={ok:()=>[784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.2,i*.12)),bad:()=>{tone(160,.45,'square',.12);tone(150,.45,'sawtooth',.08)},
 tick:()=>tone(1800,.04,'square',.05),alarm:()=>{for(let i=0;i<6;i++)tone(1760,.1,'square',.12,i*.18)},click:()=>tone(660,.07,'triangle',.15),
 win:()=>[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.3,'triangle',.2,i*.15))};
function show(id){const c=document.querySelector('.screen.on');if(c&&id!==c.id)prev=c.id;document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');if(id==='wheel')drawWheel();SND.click()}
function back(){show(prev==='wheel'?'start':prev)}
function startGame(){names=[$('n0').value||'الفريق 1',$('n1').value||'الفريق 2'];$('L0').textContent=names[0];$('L1').textContent=names[1];
 const b=$('board');b.innerHTML='';CATS.forEach(c=>b.insertAdjacentHTML('beforeend',`<div class="cat">${c.n}</div>`));
 for(let r=0;r<4;r++)for(let c=0;c<3;c++){const t=document.createElement('button');t.className='tile';t.textContent=PTS[r];t.onclick=()=>openQ(c,r,t);b.appendChild(t)}
 show('game');upd()}
function upd(){$('S0').textContent=score[0];$('S1').textContent=score[1];$('T0').classList.toggle('turn',turn===0);$('T1').classList.toggle('turn',turn===1)}
function openQ(c,r,tile){if(tile.classList.contains('done'))return;const q=CATS[c].q[r];cur={q,pts:PTS[r],tile};stealing=false;
 $('mp').textContent=PTS[r]+' نقطة';$('mq').textContent=q[0];$('mm').textContent='';$('me').style.display='none';$('close').style.display='none';
 $('mo').innerHTML='';q[1].forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=['أ','ب','ج','د'][i]+') '+o;b.onclick=()=>answer(i,b);$('mo').appendChild(b)});
 setWho();$('modal').classList.add('on');startTimer();SND.click()}
function setWho(){$('mw').textContent=(stealing?'🔄 سؤال مسروق: ':'دور: ')+names[turn]}
function startTimer(){clearInterval(timer);left=30;tick();timer=setInterval(()=>{left--;tick();if(left<=5&&left>0)SND.tick();if(left<=0){clearInterval(timer);SND.alarm();timeUp()}},1000)}
function tick(){$('rt').textContent=left;$('rc').setAttribute('stroke-dashoffset',201*(1-left/30));$('rc').setAttribute('stroke',left<=5?'#C0392B':'#C9A227')}
function timeUp(){$('mm').innerHTML='⏰ انتهى الوقت!';wrong(null)}
function answer(i,b){clearInterval(timer);const q=cur.q;
 if(i===q[2]){b.classList.add('ok');const p=stealing?cur.pts/2:cur.pts;score[turn]+=p;SND.ok();confetti();$('mm').innerHTML=`✓ أحسنتِ! +${p} لـ ${names[turn]}`;$('mm').style.color='#2E8B57';reveal();
  if(!stealing)turn=1-turn;}
 else{b.classList.add('bad');b.disabled=true;SND.bad();wrong(b)}upd()}
function wrong(b){$('mm').style.color='#C0392B';
 if(!stealing){stealing=true;turn=1-turn;upd();$('mm').innerHTML=($('mm').innerHTML.includes('⏰')?'⏰ انتهى الوقت! ':'✗ إجابة غير صحيحة. ')+'فرصة سرقة لـ '+names[turn]+' بنصف النقاط';setWho();startTimer()}
 else{$('mm').innerHTML+=' — لا نقاط في هذا السؤال';reveal();}}
function reveal(){clearInterval(timer);const q=cur.q;[...$('mo').children].forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add('ok')});$('me').textContent='💡 '+q[3];$('me').style.display='block';$('close').style.display='inline-block';cur.tile.classList.add('done')}
function closeQ(){$('modal').classList.remove('on');stealing=false;upd();if([...document.querySelectorAll('.tile')].every(t=>t.classList.contains('done')))setTimeout(finish,400)}
function finish(){show('end');const w=score[0]===score[1]?'تعادل رائع! 🤝':'الفائز: '+names[score[0]>score[1]?0:1];$('winner').textContent=w;$('final').textContent=`${names[0]}: ${score[0]}  •  ${names[1]}: ${score[1]}`;SND.win();confetti(250)}
// confetti
function confetti(n=120){const c=$('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#D9718F','#C9A227','#1F2A5C','#2A8C8C','#F2B880'];
 let P=[...Array(n)].map(()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,r:Math.random()*7+4,c:cols[Math.random()*5|0],a:Math.random()*6}));let f=0;
 (function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++f<130)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})()}
// wheel
$('names').value=[...Array(24)].map((_,i)=>'الطالبة '+(i+1)).join('\n');let ang=0,spinning=false;
function list(){return $('names').value.split('\n').map(s=>s.trim()).filter(Boolean)}
function drawWheel(){const c=$('wc'),x=c.getContext('2d'),L=list(),n=L.length||1,R=260,cx=280,cy=280;const cols=['#E88FA8','#1F2A5C','#C9A227','#7FB7BE','#B07BAC','#F2B880'];
 x.clearRect(0,0,560,560);x.save();x.translate(cx,cy);x.rotate(ang);
 for(let i=0;i<n;i++){const a0=i*2*Math.PI/n,a1=(i+1)*2*Math.PI/n;x.beginPath();x.moveTo(0,0);x.arc(0,0,R,a0,a1);x.fillStyle=cols[i%6];if(n%6===1&&i===n-1)x.fillStyle=cols[2];x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();
  x.save();x.rotate((a0+a1)/2);x.fillStyle='#fff';x.font=`700 ${n>30?12:16}px Almarai`;x.textAlign='right';x.direction='rtl';x.fillText(L[i]||'',R-14,6);x.restore()}
 x.restore();x.beginPath();x.arc(cx,cy,34,0,7);x.fillStyle='#fff';x.fill();x.lineWidth=6;x.strokeStyle='#C9A227';x.stroke();
 x.beginPath();x.moveTo(cx+R-6,cy);x.lineTo(cx+R+22,cy-14);x.lineTo(cx+R+22,cy+14);x.closePath();x.fillStyle='#C0392B';x.fill()}
function spin(){if(spinning)return;const L=list();if(!L.length)return;spinning=true;$('picked').textContent='';const total=Math.PI*2*(5+Math.random()*3),dur=4200,st=performance.now(),a0=ang;let last=0;
 (function f(t){const k=Math.min(1,(t-st)/dur),e=1-Math.pow(1-k,3);ang=a0+total*e;drawWheel();const seg=Math.floor(ang/(2*Math.PI/L.length));if(seg!==last){SND.tick();last=seg}
  if(k<1)requestAnimationFrame(f);else{spinning=false;const n=L.length,a=((-ang)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);const i=Math.floor(a/(2*Math.PI/n))%n;$('picked').textContent='🎉 '+L[i];SND.ok();confetti(80);
   if($('rm').checked){L.splice(i,1);$('names').value=L.join('\n');setTimeout(drawWheel,1200)}}})(st)}
if(location.hash==='#wheel')show('wheel');addEventListener('hashchange',()=>{if(location.hash==='#wheel')show('wheel')});
</script>
</body>
</html>
