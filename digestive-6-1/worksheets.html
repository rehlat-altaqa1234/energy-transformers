.glass{background:rgba(255,255,255,.66);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1.5px solid rgba(255,255,255,.85);box-shadow:0 8px 30px rgba(90,36,72,.15)}
.bar{position:sticky;top:10px;margin:10px 16px;border-radius:20px;padding:10px 18px;display:flex;gap:10px;align-items:center;z-index:5;flex-wrap:wrap}
.bar img{height:42px}
.bar b{flex:1;font-size:18px}
.btn{font-family:inherit;font-weight:700;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;font-size:14px;background:var(--navy);color:#fff}
.btn.rose{background:var(--rose)}.btn.gold{background:var(--gold)}.btn.teal{background:var(--teal)}.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 16px}
.tabs button{font-family:inherit;font-weight:700;font-size:15px;border:0;border-radius:14px;padding:10px 16px;background:rgba(255,255,255,.75);color:var(--navy);cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff}
.tabs button .sc{display:inline-block;margin-inline-start:6px;background:var(--gold);color:#fff;border-radius:999px;padding:0 8px;font-size:12px}
.sheet{display:none;max-width:1000px;margin:12px auto 30px;border-radius:22px;padding:20px 24px}
.sheet.on{display:block}
.head{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:6px;flex-wrap:wrap}
.head h1{font-size:22px;margin:0;flex:1}
.badge{background:var(--rose);color:#fff;border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px}
.who{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.who input{font-family:inherit;font-size:15px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;min-width:200px}
.q{margin-top:12px;background:rgba(255,255,255,.85);border:1.5px solid var(--line);border-radius:16px;padding:12px 16px}
.q h3{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:10px}
.q h3 .n{background:var(--navy);color:#fff;border-radius:50%;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.q p{margin:8px 0;font-size:16px;line-height:2}
select,input.txt{font-family:inherit;font-size:15px;font-weight:700;padding:5px 10px;border-radius:10px;border:2px solid var(--rose);background:#fff;color:var(--navy);min-width:130px}
textarea{font-family:inherit;font-size:15px;width:100%;min-height:64px;border-radius:12px;border:2px solid var(--line);padding:8px}
.ok{border-color:var(--ok)!important;background:#E6F6EE!important}
.bad{border-color:var(--bad)!important;background:#FDECEA!important}
.grp{display:inline-flex;gap:6px;flex-wrap:wrap}
.grp button,.multi button{font-family:inherit;font-weight:700;font-size:15px;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:5px 14px;cursor:pointer}
.grp button.sel,.multi button.sel{background:var(--navy);color:#fff}
.grp button.sel.ok{background:var(--ok)!important;color:#fff;border-color:var(--ok)}
.grp button.sel.bad{background:var(--bad)!important;color:#fff;border-color:var(--bad)}
.multi{display:flex;gap:8px;flex-wrap:wrap}
.multi button.sel.ok{background:var(--ok)!important;color:#fff}.multi button.sel.bad{background:var(--bad)!important;color:#fff}
.multi button.miss{border-style:dashed;border-color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border:1.5px solid var(--line);padding:7px;text-align:center}
th{background:var(--navy);color:#fff}
td{background:#fff}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.bank span{border:1.5px dashed var(--rose);border-radius:8px;padding:3px 10px;font-size:14px;font-weight:700;background:#fff}
.stages{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stages .ar{font-size:22px;color:var(--rose)}
.model-ans{display:none;margin-top:8px;background:#E6F6EE;border:1.5px solid var(--ok);border-radius:12px;padding:8px 12px;color:#145C3B;font-weight:700;line-height:1.8}
.show .model-ans{display:block}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.score{font-size:18px;font-weight:700}
.two{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.model{position:relative}
.model img{width:100%;display:block;border-radius:14px}
.model .pin{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:var(--rose);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.model .pin.acc{background:var(--teal)}
.ws{border-collapse:collapse;margin:auto;user-select:none;width:auto}
.ws td{width:42px;height:42px;font-size:21px;font-weight:700;padding:0;cursor:pointer;transition:background .15s}
.ws td.sel{background:#FAD7E3;color:#C0392B}
.ws td.found{background:#BFE8D4;color:#145C3B}
.bank.words span.done{text-decoration:line-through;background:#BFE8D4;border-color:var(--ok)}
.emo button{font-size:22px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:2px 8px;cursor:pointer}
.emo button.sel{border-color:var(--gold);background:#FFF4DA}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:20}
@media(max-width:600px){.bar{top:0;margin:6px;padding:8px 10px;gap:6px}.bar img{height:30px}.bar b{font-size:13px;flex:1 1 60%}.bar .btn{font-size:12px;padding:7px 10px}.sheet{margin:8px 6px 20px;padding:14px 12px;border-radius:18px}.head h1{font-size:18px}.q{padding:10px}.q p{font-size:15px}.who input{min-width:0;flex:1 1 45%}.stages .ar{transform:rotate(-90deg)}table{font-size:13px}th,td{padding:5px}.grp button{font-size:13px;padding:4px 10px}}
@media(max-width:800px){.two{grid-template-columns:1fr}.ws td{width:30px;height:30px;font-size:16px}}
@media print{body{background:#fff}.bar,.tabs,.actions{display:none}.sheet{display:block!important;box-shadow:none;background:#fff;page-break-after:always;backdrop-filter:none}}
</style>
</head>

const S1=()=>{const pr=[['مضغ الطعام بالأسنان','ميكانيكي'],['تحليل البروتينات بمساعدة الإنزيمات','كيميائي'],['خلط الطعام','ميكانيكي'],['تحليل الكربوهيدرات بالتفاعلات الكيميائية','كيميائي'],['طحن الطعام بالأضراس','ميكانيكي'],['تحليل الدهون إلى جزيئات أصغر','كيميائي']];
 const st=['البلع','الهضم','الامتصاص','التخلص من الفضلات'];const W=['الفم','المواد الغذائية','الهضم','فضلات','الدم'];
 return `<div class="q">${qn(1,'رتّبي المراحل الرئيسة الأربع التي يمرّ بها الطعام في أثناء عبوره القناة الهضمية:')}<div class="stages">${st.map((s,i)=>`${sel(s,st)}${i<3?'<span class="ar">←</span>':''}`).join('')}</div></div>

 <div class="q">${qn(3,'أكملي الفراغات بالكلمة المناسبة:')}
 <p>1) يُقصد بـ ${sel('الهضم',W)} تحليل الطعام إلى جزيئات أصغر يمكن امتصاصها ونقلها إلى ${sel('الدم',W)}.</p>
 <p>2) تبدأ عملية هضم الطعام بمجرد دخوله إلى ${sel('الفم',W)}.</p>
 <p>3) تزوّد ${sel('المواد الغذائية',W)} الجسم بالطاقة والمواد الضرورية لنمو الخلايا وتعويض التالف منها.</p>

 <div class="q">${qn(2,'صح أم خطأ؟ وصحّحي العبارة الخطأ:')}<table><tr><th>العبارة</th><th>الحكم</th><th>التصحيح</th></tr>${tf.map(([t,k])=>`<tr><td>${t}</td><td>${grp(k,['صح','خطأ'])}</td><td><input style="font-family:inherit;width:100%;padding:6px;border-radius:8px;border:1.5px solid var(--line)" placeholder="${k==='خطأ'?'اكتبي التصحيح':'—'}"></td></tr>`).join('')}</table>
 <div class="model-ans">✔ التصحيح: الإنزيم لا يتغيّر ولا يفنى بعد التفاعل • الإنزيمات تقلّل كمية الطاقة اللازمة لبدء التفاعل.</div></div>
 <div class="q">${qn(3,'علّلي: لولا الإنزيمات لكانت التفاعلات الكيميائية في الجسم بطيئة جدًّا.')}${open('لأن الإنزيمات تسرّع معدل التفاعلات الكيميائية من خلال تقليل كمية الطاقة الضرورية لبدء التفاعل.')}</div>
 <div class="q">${qn(4,'لا يقتصر عمل الإنزيمات على الهضم. اذكري ثلاثة أدوار أخرى لها:')}${open('زيادة سرعة التفاعلات المسؤولة عن بناء الجسم، وإطلاق الطاقة في خلايا العضلات والخلايا العصبية، وتجلّط الدم.')}</div>
 <div class="q">${qn(5,'اختاري الأعضاء الأربعة التي تصنع الإنزيمات الهاضمة:')}<div class="multi" data-ans="الغدد اللعابية,المعدة,الأمعاء الدقيقة,البنكرياس">${shuffle(['الغدد اللعابية','المعدة','الأمعاء الدقيقة','البنكرياس','المريء','المستقيم','فتحة الشرج','اللسان']).map(o=>`<button type="button" data-v="${o}">${o}</button>`).join('')}</div></div>`};
const ORG=[['الفم',40.9,11.2,1],['اللسان',40.9,14.3,0],['الأسنان',47.8,8.5,0],['الغدد اللعابية',26.9,10.6,0],['المريء',43.3,26.6,1],['الكبد',27.9,43.6,0],['الحويصلة الصفراء',21.5,49.4,0],['المعدة',56.9,43.6,1],['البنكرياس',54.2,53.7,0],['الأمعاء الدقيقة',40.6,69,1],['الأمعاء الغليظة',13.3,68,1],['المستقيم',41.5,85,1],['فتحة الشرج',42.1,90.9,1]];
const S3=()=>{const names=ORG.map(o=>o[0]);
 return `<div class="q">${qn(1,'اختاري اسم العضو المقابل لكل رقم على مجسم الجهاز الهضمي:')}<div class="two"><div class="model"><img src="${MODEL}">${ORG.map((o,i)=>`<div class="pin${o[3]?'':' acc'}" style="left:${o[1]}%;top:${o[2]}%">${i+1}</div>`).join('')}</div>
 <table><tr><th>#</th><th>اسم العضو</th></tr>${ORG.map((o,i)=>`<tr><td>${i+1}</td><td>${sel(o[0],names)}</td></tr>`).join('')}</table></div></div>
 <div class="q">${qn(2,'صنّفي كل عضو: هل هو من القناة الهضمية أم من الأعضاء الملحقة؟')}<table><tr><th>العضو</th><th>التصنيف</th></tr>${shuffle(ORG).map(o=>`<tr><td>${o[0]}</td><td>${grp(o[3]?'القناة الهضمية':'عضو ملحق',['القناة الهضمية','عضو ملحق'])}</td></tr>`).join('')}</table></div>
 <div class="q">${qn(3,'ما الذي تقدّمه الأعضاء الملحقة للقناة الهضمية مع أن الطعام لا يمرّ بها؟')}${open('تنتج أو تخزّن الإنزيمات والمواد الكيميائية الأخرى التي تساعد على تحليل الطعام في أثناء مروره بالقناة الهضمية.')}</div>`};
const WORDS=['فم','مريء','معدة','كبد','لسان','أسنان','بنكرياس','مستقيم','إنزيم','هضم'];let WPOS={};
function makeGrid(){const N=11;let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};const g=[...Array(N)].map(()=>Array(N).fill(null));
 for(const w of WORDS){const L=[...w];let placed=false;for(let t=0;t<400&&!placed;t++){const dir=rnd()<.6?0:1;const r=Math.floor(rnd()*N),c=Math.floor(rnd()*N);
   const cells=L.map((_,i)=>dir===0?[r,c+i]:[r+i,c]);if(cells.some(([y,x])=>y<0||y>=N||x<0||x>=N))continue;if(cells.some(([y,x],i)=>g[y][x]&&g[y][x]!==L[i]))continue;
   cells.forEach(([y,x],i)=>g[y][x]=L[i]);WPOS[w]=cells;placed=true}}
 const pool='ابتثجحخدذرزسشصضطظعغفقكلمنهوي';for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!g[y][x])g[y][x]=pool[Math.floor(rnd()*pool.length)];return g}
const GRID=makeGrid();
const S4=()=>`<div class="q">${qn(1,'🔎 لعبة البحث عن الكلمات: اضغطي على حروف كل كلمة لتلوينها (أفقيًا من اليمين إلى اليسار، أو رأسيًا من أعلى إلى أسفل):')}
 <div class="bank words" id="wbank" style="justify-content:center">${WORDS.map(w=>`<span data-w="${w}">${w}</span>`).join('')}</div>
 <table class="ws" dir="ltr" id="wgrid">${GRID.map((row,y)=>`<tr>${row.map((_,xr)=>{const x=row.length-1-xr;return `<td data-y="${y}" data-x="${x}">${row[x]}</td>`}).join('')}</tr>`).join('')}</table>
 <p style="text-align:center" class="score" id="wfound">وجدتِ 0 من 10 كلمات</p></div>
 <div class="q">${qn(2,'🧩 من أنا؟ اكتبي اسم العضو:')}
 <p>1) أنبوب أصل الفم بالمعدة: ${txt('المريء')}</p><p>2) كيس صغير ملتصق بالكبد: ${txt('الحويصلة الصفراء|الحويصلة|المرارة')}</p>
 <p>3) غدة أقع خلف المعدة: ${txt('البنكرياس')}</p><p>4) نهاية القناة الهضمية: ${txt('فتحة الشرج|الشرج')}</p><p>5) بروتين أسرّع التفاعلات الكيميائية ولا أتغيّر: ${txt('الإنزيم|إنزيم')}</p></div>
 <div class="q">${qn(3,'قيّمي نفسك:')}${['أعدّد مراحل مرور الطعام','أميّز نوعي الهضم','أوضّح كيف يعمل الإنزيم','أعدّد أعضاء الجهاز الهضمي'].map(t=>`<p>${t} <span class="emo">${['😀','🙂','🤔'].map(e=>`<button type="button">${e}</button>`).join(' ')}</span></p>`).join('')}</div>`;
const SHEETS=[['ورقة (1): وظائف الجهاز الهضمي ونوعا الهضم','ورقة 1',S1],['ورقة (2): الإنزيمات','ورقة 2',S2],['ورقة (3): أعضاء الجهاز الهضمي','ورقة 3',S3],['ورقة لعب (4): البحث عن الكلمات','لعبة',S4]];
$('tabs').innerHTML=SHEETS.map(([t,b],i)=>`<button data-i="${i}" class="${i?'':'on'}">${b}<span class="sc" id="sc${i}" style="display:none"></span></button>`).join('');
$('sheets').innerHTML=SHEETS.map(([t,b,f],i)=>`<section class="sheet glass ${i?'':'on'}" id="sh${i}"><div class="head"><h1>${t}</h1><span class="badge">${b}</span></div>${who}${f()}
 <div class="actions"><button class="btn gold" onclick="check(${i})">✔ تحقّقي من إجاباتي</button><button class="btn teal" onclick="solve(${i})">💡 إظهار الحل</button><button class="btn ghost" onclick="resetS(${i})">↺ إعادة</button>${i<3?`<button class="btn rose" onclick="go(${i+1})">الورقة التالية ◀</button>`:''}<span class="score" id="r${i}"></span></div></section>`).join('');
function go(i){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));document.querySelectorAll('.sheet').forEach((s,j)=>s.classList.toggle('on',j===i));scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
document.addEventListener('click',e=>{const b=e.target.closest('.grp button');if(b){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel','ok','bad'));b.classList.add('sel');return}
 const m=e.target.closest('.multi button');if(m){m.classList.toggle('sel');m.classList.remove('ok','bad');return}
 const em=e.target.closest('.emo button');if(em){em.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));em.classList.add('sel')}});
document.addEventListener('change',e=>{if(e.target.matches('select,input.txt'))e.target.classList.remove('ok','bad')});
const norm=s=>s.trim().replace(/[ً-ْ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ');
function check(i){const S=$('sh'+i);let ok=0,tot=0;
 S.querySelectorAll('select[data-ans]').forEach(s=>{tot++;const g=s.value===s.dataset.ans;s.classList.toggle('ok',g);s.classList.toggle('bad',!g);if(g)ok++});
 S.querySelectorAll('input.txt[data-ans]').forEach(s=>{tot++;const g=s.dataset.ans.split('|').some(a=>norm(a)===norm(s.value));s.classList.toggle('ok',g);s.classList.toggle('bad',!g);if(g)ok++});
 S.querySelectorAll('.grp[data-ans]').forEach(gp=>{tot++;const b=gp.querySelector('button.sel');gp.querySelectorAll('button').forEach(x=>x.classList.remove('ok','bad'));if(b){const g=b.dataset.v===gp.dataset.ans;b.classList.add(g?'ok':'bad');if(g)ok++}});
 S.querySelectorAll('.multi[data-ans]').forEach(m=>{const ans=m.dataset.ans.split(',');tot+=ans.length;m.querySelectorAll('button').forEach(b=>{b.classList.remove('ok','bad','miss');const inA=ans.includes(b.dataset.v);if(b.classList.contains('sel')){b.classList.add(inA?'ok':'bad');if(inA)ok++;else ok=Math.max(0,ok-1)}else if(inA)b.classList.add('miss')})});
 if(i===3){tot+=WORDS.length;ok+=foundCount()}
 S.classList.add('show');const r=$('r'+i);r.textContent=`النتيجة: ${ok} / ${tot}`;r.style.color=ok===tot?'#2E8B57':'#5A2448';
 const sc=$('sc'+i);sc.style.display='inline-block';sc.textContent=`${ok}/${tot}`;if(ok===tot)confetti()}
function solve(i){const S=$('sh'+i);S.querySelectorAll('select[data-ans]').forEach(s=>{s.value=s.dataset.ans;s.classList.add('ok');s.classList.remove('bad')});
 S.querySelectorAll('input.txt[data-ans]').forEach(s=>{s.value=s.dataset.ans.split('|')[0];s.classList.add('ok')});
 S.querySelectorAll('.grp[data-ans]').forEach(gp=>gp.querySelectorAll('button').forEach(b=>{const g=b.dataset.v===gp.dataset.ans;b.classList.toggle('sel',g);b.classList.toggle('ok',g);b.classList.remove('bad')}));
 S.querySelectorAll('.multi[data-ans]').forEach(m=>{const ans=m.dataset.ans.split(',');m.querySelectorAll('button').forEach(b=>{const g=ans.includes(b.dataset.v);b.classList.toggle('sel',g);b.classList.toggle('ok',g);b.classList.remove('bad','miss')})});
 if(i===3){Object.values(WPOS).flat().forEach(([y,x])=>cell(y,x).classList.add('sel'));updWords()}
 S.classList.add('show')}
function resetS(i){const S=$('sh'+i);S.querySelectorAll('select').forEach(s=>{s.value='';s.classList.remove('ok','bad')});S.querySelectorAll('input.txt,textarea').forEach(s=>{s.value='';s.classList.remove('ok','bad')});
 S.querySelectorAll('.grp button,.multi button').forEach(b=>b.classList.remove('sel','ok','bad','miss'));S.classList.remove('show');$('r'+i).textContent='';$('sc'+i).style.display='none';
 if(i===3){document.querySelectorAll('#wgrid td').forEach(t=>t.classList.remove('sel','found'));updWords()}}
const cell=(y,x)=>document.querySelector(`#wgrid td[data-y="${y}"][data-x="${x}"]`);
function foundCount(){return WORDS.filter(w=>WPOS[w]&&WPOS[w].every(([y,x])=>cell(y,x).classList.contains('sel'))).length}
function updWords(){let n=0;document.querySelectorAll('#wgrid td').forEach(t=>t.classList.remove('found'));WORDS.forEach(w=>{const f=WPOS[w]&&WPOS[w].every(([y,x])=>cell(y,x).classList.contains('sel'));document.querySelector(`#wbank span[data-w="${w}"]`).classList.toggle('done',f);if(f){n++;WPOS[w].forEach(([y,x])=>cell(y,x).classList.add('found'))}});
 $('wfound').textContent=`وجدتِ ${n} من 10 كلمات`+(n===10?' 🎉':'');if(n===10)confetti()}
document.querySelectorAll('#wgrid td').forEach(t=>t.onclick=()=>{t.classList.toggle('sel');updWords()});
function confetti(n=140){const c=$('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#C2577A','#C9A227','#5A2448','#2E9C96','#EDB3C6'];
 let P=[...Array(n)].map(()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,r:Math.random()*7+4,c:cols[Math.random()*5|0],a:Math.random()*6}));let f=0;
 (function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++f<130)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})()}
</script>
</body>
</html>
