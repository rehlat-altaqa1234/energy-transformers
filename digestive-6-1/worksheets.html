:root{--navy:#5A2448;--rose:#C2577A;--teal:#2E9C96;--gold:#C9A227;--soft:#FCE6EE;--line:#EDC3D2}
*{box-sizing:border-box}
@page{size:A4;margin:0}
body{margin:0;font-family:'Almarai',sans-serif;color:var(--navy);background:#EFE4E9}
.bar{position:sticky;top:0;background:#fff;padding:10px 20px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);z-index:5;flex-wrap:wrap}
.bar b{flex:1}
.btn{font-family:inherit;font-weight:700;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;font-size:14px;background:var(--navy);color:#fff}
.btn.rose{background:var(--rose)}
.page{width:210mm;height:297mm;margin:10mm auto;background:#fff;padding:11mm 13mm;position:relative;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.head{display:flex;align-items:center;gap:12px;border:2px solid var(--navy);border-radius:14px;padding:8px 12px;background:linear-gradient(90deg,#fff,#FFF2F6)}
.head img{height:44px}
.head .t{flex:1}
.head h1{font-size:20px;margin:0}
.head .s{font-size:11px;color:#7A5A6E;margin-top:3px}
.badge{background:var(--rose);color:#fff;border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;text-align:center}
.info{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:8px 0 6px;font-size:13px}
.info div{border-bottom:1.5px dotted var(--navy);padding:4px 0}
.q{margin-top:8px;border:1.5px solid var(--line);border-radius:12px;padding:7px 12px;page-break-inside:avoid}
.q h3{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.q h3 span.n{background:var(--navy);color:#fff;border-radius:50%;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.q p{margin:3px 0;font-size:13.2px;line-height:1.75}
.dots{border-bottom:1.5px dotted #9AA;height:24px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1.5px solid var(--line);padding:5px;text-align:center;height:29px}
th{background:var(--navy);color:#fff}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.bank span{border:1.5px dashed var(--rose);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700}
.choice span{display:inline-block;border:1.5px solid var(--navy);border-radius:999px;padding:1px 11px;margin:2px 3px;font-size:12.8px}
.foot{position:absolute;bottom:7mm;left:13mm;right:13mm;display:flex;justify-content:space-between;font-size:11px;color:#9A7F8E}
.ans{color:#C0392B;font-weight:700}
.key .q{border-color:#C0392B55}
.stages{display:flex;align-items:center;gap:6px;direction:rtl;margin:6px 0}
.stages .b{flex:1;height:58px;border:2px solid var(--rose);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;text-align:center;background:#FFF7FA}
.stages .ar{font-size:20px;color:var(--rose)}
.model{position:relative;width:62mm;margin:auto}
.model img{width:100%;display:block;border-radius:10px}
.model .pin{position:absolute;transform:translate(-50%,-50%);width:17px;height:17px;border-radius:50%;background:var(--rose);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.model .pin.acc{background:var(--teal)}
.two{display:grid;grid-template-columns:64mm 1fr;gap:10px;align-items:start}
.ws{border-collapse:collapse;margin:auto}
.ws td{width:31px;height:31px;border:1.5px solid var(--line);font-size:17px;font-weight:700;padding:0}
.ws td.hl{background:#FAD7E3;color:#C0392B}
.self{display:flex;gap:6px;align-items:center;font-size:12.5px;flex-wrap:wrap}
svg text{font-family:Almarai}
@media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none;page-break-after:always}}

function sheet1(a){const st=['البلع','الهضم','الامتصاص','التخلص من الفضلات'];const pr=[['مضغ الطعام بالأسنان',1],['تحليل البروتينات بمساعدة الإنزيمات',0],['خلط الطعام',1],['تحليل الكربوهيدرات بالتفاعلات الكيميائية',0],['طحن الطعام بالأضراس',1],['تحليل الدهون إلى جزيئات أصغر',0]];
 return `<div class="q">${qn(1,'رتّبي المراحل الرئيسة الأربع التي يمرّ بها الطعام في أثناء عبوره القناة الهضمية:')}<div class="bank">${['الامتصاص','البلع','التخلص من الفضلات','الهضم'].map(x=>`<span>${x}</span>`).join('')}</div>
 <div class="stages">${st.map((x,i)=>`<div class="b">${a?`<span class="ans">${x}</span>`:(i+1)}</div>${i<3?'<span class="ar">←</span>':''}`).join('')}</div></div>
 <div class="q">${qn(2,'ضعي علامة ✓ في العمود المناسب:')}<table><tr><th>العملية</th><th>هضم ميكانيكي</th><th>هضم كيميائي</th></tr>${pr.map(([t,m])=>`<tr><td>${t}</td><td class="ans">${a&&m?'✓':''}</td><td class="ans">${a&&!m?'✓':''}</td></tr>`).join('')}</table></div>
 <div class="q">${qn(3,'أكملي الفراغات بالكلمة المناسبة من بنك الكلمات:')}<div class="bank"><span>الفم</span><span>المواد الغذائية</span><span>الهضم</span><span>فضلات</span><span>الدم</span></div>
 <p>1) يُقصد بـ ${A(a,'الهضم')} تحليل الطعام إلى جزيئات أصغر يمكن امتصاصها ونقلها إلى ${A(a,'الدم')}.</p>
 <p>2) تبدأ عملية هضم الطعام بمجرد دخوله إلى ${A(a,'الفم')}.</p>
 <p>3) تزوّد ${A(a,'المواد الغذائية')} الجسم بالطاقة والمواد الضرورية لنمو الخلايا وتعويض التالف منها.</p>
 <p>4) المواد التي لا يستفيد منها الجسم تُطرح خارجه بوصفها ${A(a,'فضلات')}.</p></div>
 <div class="q">${qn(4,'اختاري الإجابة الصحيحة:')}${mcq([['مضغ الطعام وخلطه هضم:',['كيميائي','ميكانيكي','إنزيمي'],1],['تحليل الغذاء بفعل التفاعلات الكيميائية هو الهضم:',['الكيميائي','الميكانيكي','الحركي'],0]],a)}</div>
 <div class="q">${qn(5,'قارني: ما الفرق بين الهضم الميكانيكي والهضم الكيميائي؟')}${a?'<p class="ans">الهضم الميكانيكي هو مضغ الطعام وخلطه، أما الهضم الكيميائي فهو تحليل الغذاء بفعل التفاعلات الكيميائية في القناة الهضمية.</p>':D(a,2)}</div>`}

function sheet2(a){const tf=[['الإنزيمات نوع من البروتينات.',1],['يتغيّر الإنزيم ويفنى بعد التفاعل الكيميائي.',0],['تزيد الإنزيمات كمية الطاقة اللازمة لبدء التفاعل.',0],['تساعد الإنزيمات على تجلّط الدم.',1]];

// ---------- sheet 4 (word search game)
const WORDS=['فم','مريء','معدة','كبد','لسان','أسنان','بنكرياس','مستقيم','إنزيم','هضم'];
function makeGrid(){const N=11;let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
 const g=[...Array(N)].map(()=>Array(N).fill(null)),hl=[...Array(N)].map(()=>Array(N).fill(false));
 for(const w of WORDS){const L=[...w];let placed=false;for(let t=0;t<400&&!placed;t++){const dir=rnd()<.6?0:1;const r=Math.floor(rnd()*N),c=Math.floor(rnd()*N);
   const cells=L.map((_,i)=>dir===0?[r,c+i]:[r+i,c]);if(cells.some(([y,x])=>y<0||y>=N||x<0||x>=N))continue;if(cells.some(([y,x],i)=>g[y][x]&&g[y][x]!==L[i]))continue;
   cells.forEach(([y,x],i)=>{g[y][x]=L[i];hl[y][x]=true});placed=true}}
 const pool='ابتثجحخدذرزسشصضطظعغفقكلمنهوي';for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!g[y][x])g[y][x]=pool[Math.floor(rnd()*pool.length)];return {g,hl}}
const GRID=makeGrid();
function sheet4(a){return `<div class="q">${qn(1,'🔎 لعبة البحث عن الكلمات: ابحثي عن الكلمات العشر في الشبكة (أفقيًا من اليمين إلى اليسار، أو رأسيًا من أعلى إلى أسفل)، ولوّنيها:')}
 <div class="bank" style="justify-content:center">${WORDS.map(w=>`<span>${w}</span>`).join('')}</div>
 <table class="ws" dir="ltr">${GRID.g.map((row,y)=>`<tr>${row.slice().reverse().map((ch,xr)=>{const x=row.length-1-xr;return `<td class="${a&&GRID.hl[y][x]?'hl':''}">${ch}</td>`}).join('')}</tr>`).join('')}</table></div>
 <div class="q">${qn(2,'🧩 من أنا؟ اكتبي اسم العضو:')}
 <p>1) أنبوب أصل الفم بالمعدة: ${A(a,'المريء')} &nbsp;&nbsp; 2) كيس صغير ملتصق بالكبد: ${A(a,'الحويصلة الصفراء')}</p>
 <p>3) غدة أقع خلف المعدة: ${A(a,'البنكرياس')} &nbsp;&nbsp; 4) نهاية القناة الهضمية: ${A(a,'فتحة الشرج')}</p>
 <p>5) بروتين أسرّع التفاعلات الكيميائية ولا أتغيّر: ${A(a,'الإنزيم')}</p></div>
 <div class="q"><div class="self"><b>قيّمي نفسك:</b> أعدّد مراحل مرور الطعام 😀 🙂 🤔 &nbsp;|&nbsp; أميّز نوعي الهضم 😀 🙂 🤔 &nbsp;|&nbsp; أعدّد أعضاء الجهاز الهضمي 😀 🙂 🤔</div></div>`}
const SHEETS=[['ورقة عمل (1): وظائف الجهاز الهضمي ونوعا الهضم','ورقة 1',sheet1],['ورقة عمل (2): الإنزيمات','ورقة 2',sheet2],['ورقة عمل (3): أعضاء الجهاز الهضمي','ورقة 3',sheet3],['ورقة لعب (4): البحث عن الكلمات','لعبة ورقية',sheet4]];

if(mode!=='key')SHEETS.forEach(([t,b,f],i)=>{html+=`<section class="page">${head(t,b)}${f(false)}${foot(i+1)}</section>`});
